name: Generate LinkedIn media
on:
  push:
    paths: ['generate_cards.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python generate_cards.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add linkedin
          git diff --cached --quiet || git commit -m 'Generate LinkedIn HD media'
          git push
